name: Vision and inventory query reuse comparison
on:
  pull_request:
    branches: [validation/vision-inventory-base-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - {label: vision, ref: 170d0972c099936cff140f46b8f6c68b38c3ff60}
          - {label: inventory, ref: c0d75895ec52df9a25d5df578cd1c173eb597a59}
        seed: [rlclones, rlclones-rl-exact-independent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare isolated candidates
        run: |
          python3 scripts/compare-population.py --baseline 217eb662e7ed0770b25961e86ff4abcbb3ab5751 --candidate "${{ matrix.candidate.ref }}" --counts 100 300 --ticks 2400 --repeats 2 --seed "${{ matrix.seed }}" --timeout 4500 --output "$RUNNER_TEMP/query-comparison"
      - name: Report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/query-comparison/comparison.csv"; then
            cat "$RUNNER_TEMP/query-comparison/comparison.csv" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-${{ matrix.candidate.label }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/query-comparison/
          if-no-files-found: warn
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: [170d0972c099936cff140f46b8f6c68b38c3ff60, c0d75895ec52df9a25d5df578cd1c173eb597a59]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Existing regression assertions
        run: |
          mkdir -p run
          printf 'level-seed=rlclones\n' > run/server.properties
          bash ./gradlew --no-daemon test build runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-regression-${{ matrix.ref }}
          path: |
            run/logs/
            build/test-results/
          if-no-files-found: warn
