name: Weapon learning regression
on:
  push:
    branches: [fix/weapon-learning-20261128]
    paths: [.github/workflows/weapon-learning.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run original acceptance tests without changing their assertions
        run: |
          mkdir -p run
          printf 'level-seed=rlclones\n' > run/server.properties
          bash ./gradlew --no-daemon test build runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-learning-regression
          path: |
            run/logs/
            build/test-results/
          if-no-files-found: warn
