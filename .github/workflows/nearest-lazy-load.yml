name: Lazy vision candidate storage validation
on:
  push:
    branches: [optimization/nearest-lazy-entries-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon test build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearest-lazy-regression
          path: build/test-results/
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [rlclones, rlclones-rl-exact-independent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare 300 clones
        run: python3 scripts/compare-population.py --baseline 5b5c0ef40033f5963997be8e5f7baf9848a824ac --candidate 53c718774f72066f2d343c822227b9a57a187046 --counts 300 --ticks 2400 --repeats 2 --seed "${{ matrix.seed }}" --timeout 4500 --output "$RUNNER_TEMP/nearest-lazy"
      - name: Report
        if: always()
        run: |
          f="$RUNNER_TEMP/nearest-lazy/comparison.csv"
          if test -f "$f"; then cat "$f" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearest-lazy-${{ matrix.seed }}
          path: ${{ runner.temp }}/nearest-lazy/
          if-no-files-found: warn
