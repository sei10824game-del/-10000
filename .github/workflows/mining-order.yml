name: Mining progress and integrated regression
on:
  pull_request:
    branches: [validation/mining-tick-order-base-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and build
        run: bash ./gradlew --no-daemon test build
      - uses: actions/upload-artifact@v4
        with:
          name: mining-repair-CANDIDATE
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Full GameTest regression
        run: |
          mkdir -p run
          printf 'level-seed=rlclones\n' > run/server.properties
          bash ./gradlew --no-daemon runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-order-regression
          path: |
            run/logs/
            build/test-results/
          if-no-files-found: warn
