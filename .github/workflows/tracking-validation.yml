name: V5 entity tracking validation

on:
  push:
    branches: [optimization/v5-tracking-20261127]
    paths:
      - .github/workflows/tracking-validation.yml

permissions:
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - count: 100
            ticks: 2400
            repeats: 3
            timeout: 3000
          - count: 200
            ticks: 2400
            repeats: 3
            timeout: 3000
          - count: 300
            ticks: 2400
            repeats: 3
            timeout: 3000
          - count: 12
            ticks: 72000
            repeats: 2
            timeout: 4800
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Original versus isolated V5
        run: |
          python3 scripts/compare-population.py \
            --baseline 23b71eaee9077217cf4db888692db52b11288275 \
            --candidate 0967cfa365a7231b2172e147190430bcd2d94bc0 \
            --counts ${{ matrix.count }} --ticks ${{ matrix.ticks }} \
            --repeats ${{ matrix.repeats }} --timeout ${{ matrix.timeout }} \
            --seed rlclones --output "$RUNNER_TEMP/population-results"
      - name: Publish comparison
        if: always()
        run: |
          report="$RUNNER_TEMP/population-results/comparison.csv"
          if test -f "$report"; then
            cat "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-${{ matrix.count }}-${{ matrix.ticks }}
          path: ${{ runner.temp }}/population-results/
          if-no-files-found: warn
