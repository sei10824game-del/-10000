name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run GameTests (headless server)
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlclones-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload gametest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
