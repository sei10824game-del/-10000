name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run GameTests (headless server)
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlclones-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload gametest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Launch client to the title screen
        env:
          RLCLONES_SMOKE: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" timeout -k 30 1500 ./gradlew runClient --no-daemon || true
          grep -h "RLCLONES_CLIENT_READY" run/logs/latest.log
          grep -q "RLCLONES_CLIENT_READY registered=true keys=key.keyboard.z,key.keyboard.x,key.keyboard.p" run/logs/latest.log
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then cat run/crash-reports/*.txt; exit 1; fi

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
