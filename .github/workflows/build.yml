name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run GameTests (headless server)
        # a fixed world seed: the test arenas sit underground, and random terrain around them (falling gravel,
        # caves, water) would make the results differ from run to run
        run: |
          mkdir -p run
          printf 'level-seed=rlclones\n' > run/server.properties
          ./gradlew runGameTestServer --no-daemon

      - name: Summarize game test results
        # the failure messages sit far up in the log: collect them (and the soak numbers) where they can be read
        # at once - the job summary, and annotations that the API serves without the whole log
        if: always()
        run: |
          log=run/logs/latest.log
          if [ ! -f "$log" ]; then echo "no $log"; exit 0; fi
          {
            echo "### Game tests"
            grep -a -E 'required tests failed|optional tests failed|GAME TESTS COMPLETE' "$log" | cut -c1-300 || true
            grep -a -E 'GameTestServer\]:    - ' "$log" | cut -c1-300 || true
            echo "### Failure messages"
            grep -a 'LogTestReporter' "$log" | grep -a ' failed!' | cut -c1-1500 || true
            echo "### Soak"
            grep -a -E 'SOAK-(SUMMARY|NONE|OPTIONS)|CLONE-DEATH' "$log" | cut -c1-1500 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -a 'LogTestReporter' "$log" | grep -a ' failed!' | head -40 | sed 's/%/%25/g' | cut -c1-1500 | while IFS= read -r l; do echo "::error title=GameTest failed::$l"; done || true
          grep -a -E 'SOAK-(SUMMARY|NONE|OPTIONS)|CLONE-DEATH' "$log" | head -40 | sed 's/%/%25/g' | cut -c1-1500 | while IFS= read -r l; do echo "::notice title=Soak::$l"; done || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlclones-jar
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload gametest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Launch client to the title screen
        env:
          RLCLONES_SMOKE: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p run/config
          printf 'earlyWindowControl = false\nversionCheck = false\n' > run/config/fml.toml
          printf 'onboardAccessibility:false\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > client-console.log 2>&1 &
          GRADLE_PID=$!
          for i in $(seq 1 120); do
            grep -q "RLCLONES_CLIENT_READY" run/logs/latest.log 2>/dev/null && break
            if ! kill -0 $GRADLE_PID 2>/dev/null; then break; fi
            sleep 5
          done
          if ! grep -q "RLCLONES_CLIENT_READY" run/logs/latest.log 2>/dev/null; then
            echo "Client did not reach the title screen"
            for pid in $(pgrep -f 'forgeclientuserdev|BootstrapLauncher'); do jstack $pid | head -200 || true; done
            tail -80 client-console.log || true
            pkill -f runClient || true; pkill -f BootstrapLauncher || true
            exit 1
          fi
          timeout 180 tail --pid=$GRADLE_PID -f /dev/null || pkill -f BootstrapLauncher || true
          grep -h "RLCLONES_CLIENT_READY" run/logs/latest.log
          grep -q "RLCLONES_CLIENT_READY registered=true keys=key.keyboard.z,key.keyboard.x,key.keyboard.p,key.keyboard.l,key.keyboard.g,key.keyboard.n" run/logs/latest.log
          if ls run/crash-reports/*.txt >/dev/null 2>&1; then cat run/crash-reports/*.txt; exit 1; fi

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
