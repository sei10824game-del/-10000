name: V3 watcher performance validation

on:
  push:
    branches:
      - optimization/v3-watcher-20261127
    paths:
      - .github/workflows/watcher-validation.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - count: 100
            ticks: 2400
            repeats: 3
            timeout: 3000
            baseline: bc7d8bcf87c94999c3291631fdc2f4e23dd1351d
          - count: 200
            ticks: 2400
            repeats: 3
            timeout: 3000
            baseline: bc7d8bcf87c94999c3291631fdc2f4e23dd1351d
          - count: 300
            ticks: 2400
            repeats: 3
            timeout: 3000
            baseline: bc7d8bcf87c94999c3291631fdc2f4e23dd1351d
          - count: 12
            ticks: 72000
            repeats: 2
            timeout: 4800
            baseline: 23b71eaee9077217cf4db888692db52b11288275
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare exact revisions
        run: |
          python3 scripts/compare-population.py \
            --baseline ${{ matrix.baseline }} \
            --candidate 0c1b7f9443e4a3229df044ffb7cc4e17b426b715 \
            --counts ${{ matrix.count }} --ticks ${{ matrix.ticks }} \
            --repeats ${{ matrix.repeats }} --timeout ${{ matrix.timeout }} \
            --seed rlclones --output "$RUNNER_TEMP/population-results"
      - name: Publish comparison
        if: always()
        run: |
          report="$RUNNER_TEMP/population-results/comparison.csv"
          if test -f "$report"; then
            cat "$report"
            printf '### Population comparison (sampled MSPT)\n\n\x60\x60\x60\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\x60\x60\x60\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watcher-${{ matrix.count }}-ticks-${{ matrix.ticks }}
          path: ${{ runner.temp }}/population-results/
          if-no-files-found: warn
