name: Deterministic reinforcement learning equivalence
on:
  push:
    branches: [validation/rl-determinism-20261128]
    paths: [.github/workflows/rl-determinism.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca6fe96fb39e517786d1ca7d105383751e1331f7
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7387f71923d14bc2d7d04943dcd740968b315b0c
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cdf9861f31148eec166998ef6a07d0b989eee64e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run identical seeded trace against both versions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rl-traces"
          testfile=src/test/java/com/rlclones/ai/brain/SeededLearningComparisonTest.java
          for version in baseline candidate; do
            cp "harness/$testfile" "$version/$testfile"
            (
              cd "$version"
              RL_EXACT_OUTPUT="$RUNNER_TEMP/rl-traces/$version.txt" bash ./gradlew --no-daemon test --tests '*SeededLearningComparisonTest' --rerun-tasks
            )
          done
          diff -u "$RUNNER_TEMP/rl-traces/baseline.txt" "$RUNNER_TEMP/rl-traces/candidate.txt"
          cat "$RUNNER_TEMP/rl-traces/candidate.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-learning-traces
          path: |
            ${{ runner.temp }}/rl-traces/
            baseline/build/test-results/
            candidate/build/test-results/
          if-no-files-found: warn
