name: RL exact full regression and independent performance verification
on:
  push:
    branches: [optimization/rl-exact-20261128]
    paths: [.github/workflows/rl-exact.yml]
  pull_request:
    branches: [validation/rl-exact-base-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: 7387f71923d14bc2d7d04943dcd740968b315b0c
            label: baseline
          - ref: 3a15bc05149b040eae2601e6312b3ba4c3100ea4
            label: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and all configured GameTest namespaces
        run: |
          mkdir -p run
          printf 'level-seed=rlclones\n' > run/server.properties
          bash ./gradlew --no-daemon test runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-${{ matrix.label }}
          path: |
            run/logs/
            build/test-results/
          if-no-files-found: warn
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [rlclones, rlclones-rl-exact-independent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Repeat 100/300-clone comparison with matching world seed
        run: |
          python3 scripts/compare-population.py \
            --baseline 7387f71923d14bc2d7d04943dcd740968b315b0c \
            --candidate 3a15bc05149b040eae2601e6312b3ba4c3100ea4 \
            --counts 100 300 --ticks 2400 --repeats 2 --timeout 4500 \
            --seed "${{ matrix.seed }}" --output "$RUNNER_TEMP/rl-exact-confirmation"
      - name: Report measurements
        if: always()
        run: |
          report="$RUNNER_TEMP/rl-exact-confirmation/comparison.csv"
          if test -f "$report"; then cat "$report" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rl-exact-confirmation-${{ matrix.seed }}
          path: ${{ runner.temp }}/rl-exact-confirmation/
          if-no-files-found: warn
  candidate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a15bc05149b040eae2601e6312b3ba4c3100ea4
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build reobfuscated candidate JAR for testing only
        run: |
          bash ./gradlew --no-daemon build
          ls -l build/libs/
          sha256sum build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: rlclones-rl-exact-CANDIDATE-not-final
          path: build/libs/*.jar
          if-no-files-found: error
