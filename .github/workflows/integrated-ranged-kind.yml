name: Integrated ranged weapon population comparison
on:
  push:
    branches: [validation/integrated-ranged-kind-20261128]
    paths: [.github/workflows/integrated-ranged-kind.yml]
  workflow_dispatch:
concurrency:
  group: integrated-ranged-kind-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [rlclones, rlclones-rl-exact-independent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compare repaired baseline and identical repaired baseline with ranged reuse
        run: python3 scripts/compare-population.py --baseline 5ae44e5af214761390a81ca36746391634c9aaab --candidate 55b7779f9777bc19ed443903a65bcd48017960e4 --counts 300 --ticks 2400 --repeats 2 --seed "${{ matrix.seed }}" --timeout 4500 --output "$RUNNER_TEMP/integrated-ranged"
      - name: Report
        if: always()
        run: |
          f="$RUNNER_TEMP/integrated-ranged/comparison.csv"
          if test -f "$f"; then cat "$f" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-ranged-${{ matrix.seed }}
          path: ${{ runner.temp }}/integrated-ranged/
          if-no-files-found: warn
