name: Q merge iterator verification
on:
  push:
    branches: [optimization/q-merge-fast-iterator-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon test build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q-merge-regression
          path: build/test-results/
  compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seed: [rlclones, rlclones-rl-exact-independent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/compare-population.py --baseline 5b5c0ef40033f5963997be8e5f7baf9848a824ac --candidate 1c0f1d46cdf32886043d7f9cc701dbb6f3fe7014 --counts 300 --ticks 2400 --repeats 2 --seed "${{ matrix.seed }}" --timeout 4500 --output "$RUNNER_TEMP/q-merge"
      - name: Report
        if: always()
        run: |
          f="$RUNNER_TEMP/q-merge/comparison.csv"
          if test -f "$f"; then cat "$f" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q-merge-${{ matrix.seed }}
          path: ${{ runner.temp }}/q-merge/
          if-no-files-found: warn
